<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>EFHC</title>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;min-height:100%;background:#000;color:#fff}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
    .efhc-entry-splash_content{text-align:center;width:min(84vw,360px)}
    .efhc-entry-splash_logo{width:112px;max-width:40vw;height:auto;margin-bottom:10px}
    .efhc-splash-breathe{animation:efhc-splash-breathe 2.8s ease-in-out infinite}
    @keyframes efhc-splash-breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.045);opacity:1}}
    .efhc-brand{font-size:14px;letter-spacing:.06em;color:#bfc3ce}
    .efhc-splash-progress{margin:24px auto 0;width:min(72vw,270px)}
    .efhc-splash-progress-head{display:flex;justify-content:space-between;font-size:12px;color:#bfc3ce;margin-bottom:8px}
    .efhc-splash-progress-head strong{font-weight:600}
    .efhc-splash-progress-track{height:3px;border-radius:9px;background:#2d3038;overflow:hidden}
    .efhc-splash-progress-track span{display:block;width:8%;height:100%;background:#e0b644}
  </style>
</head>
<body>
  <!-- Same EFHC splash used by the React shell. No technical offline error UI. -->
  <div class="efhc-entry-splash_content" aria-label="EFHC">
    <img class="efhc-entry-splash_logo efhc-splash-breathe"
         src="/assets/efhc/canon/efhc_logo_canon.svg" alt="EFHC" />
    <div class="efhc-brand">EFHC</div>
    <div class="efhc-splash-progress" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
      <div class="efhc-splash-progress-head"><span>Loading</span><strong>8%</strong></div>
      <div class="efhc-splash-progress-track"><span></span></div>
    </div>
  </div>
  <script>
    window.addEventListener("online", function () { window.location.reload(); });
  </script>
</body>
</html>
