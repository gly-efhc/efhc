[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --import-mode=prepend
testpaths = tests
python_files = test_*.py *_test.py case_*.py
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal:DeprecationWarning
markers =
    smoke: быстрые smoke-проверки
    unit: unit-тесты
    integration: requires a real PostgreSQL database
    visual_evidence: локальная проверка PNG, вне blocking CI
