[project]
name = "efhc-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 72
target-version = "py311"
src = ["backend/app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "A"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["backend/app"]
