name: EFHC — backend source checks

on:
  pull_request:
    paths:
      - 'main/**'
      - 'ROUTES.json'
      - '.github/workflows/efhc-backend-source.yml'
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'ROUTES.json'
      - '.github/workflows/efhc-backend-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-source:
    name: Verify backend syntax, routes and offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source and saved OpenAPI inventory
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path("main")
          assert not Path("demo_backend").exists(), "Duplicate root TEST backend"
          for required in (
              "backend/app/main.py",
              "backend/requirements.lock",
              "backend/migrations/versions/0001_initial_release_schema.py",
              "demo_backend/asgi.py",
              "demo_backend/Dockerfile",
          ):
              assert (root / required).is_file(), required

          sources = sorted(root.rglob("*.py"))
          assert sources, "Backend source tree is empty"
          for path in sources:
              ast.parse(path.read_bytes(), filename=str(path))

          api = json.loads((root / "backend/openapi/openapi.json").read_text())["paths"]
          routes = json.loads(Path("ROUTES.json").read_text())
          methods = {"get", "post", "put", "patch", "delete", "head", "options", "trace"}
          expected = {p: sorted(m.upper() for m in spec if m in methods) for p, spec in api.items()}
          actual = {p: sorted(verbs) for p, verbs in routes["api"].items()}
          assert actual == expected, "OpenAPI and route inventory differ"
          assert len(set(routes["pages"])) == len(routes["pages"]) > 0
          print(f"Python source files: {len(sources)}; OpenAPI paths: {len(api)}")
          PY
      - name: Run isolated backend contracts without Neon, TON, or secrets
        working-directory: main
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: backend
        run: |
          export EFHC_READ_CONTRACT_ROOT="$PWD/backend/app/routes"
          python -m unittest demo_backend.tests.test_demo_testnet_policy demo_backend.tests.test_read_contracts
      - name: Prevent retired internal application aliases
        run: python -I -m unittest discover -s site/ci -p test_application_aliases.py -v

  genesis-project-wallets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'sqlalchemy[asyncio]>=2.0,<2.1' 'asyncpg>=0.29,<1'
      - name: Test deterministic project bindings, guest recycle and external wallet isolation
        working-directory: main
        env:
          PYTHONPATH: backend
          EFHC_GUEST_TEST_DSN: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/neondb
        run: python -m unittest demo_backend.tests.test_genesis_guest_pool.GenesisGuestPoolTests.test_project_wallets_restore_without_verification_or_quarantine demo_backend.tests.test_genesis_guest_pool.GenesisGuestPoolTests.test_project_wallet_read_and_manage_require_current_lease demo_backend.tests.test_genesis_guest_pool.GenesisGuestPoolTests.test_ton_wallet_proof_binding_is_revoked_and_slot_quarantined_on_logout demo_backend.tests.test_genesis_guest_pool.GenesisGuestPoolTests.test_expired_ton_wallet_binding_quarantined_before_reallocation
