name: EFHC — HTML v866 / React parity

on:
  push:
    branches: ['recovery/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_review:
        description: "Run complete rendered browser, regression and quality acceptance checks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: efhc-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prefixes:
    uses: ./.github/workflows/no-work-prefixes.yml
    with:
      check_name: Parity prefix gate
  parity:
    needs: prefixes
    name: v866 contracts, build and rendered React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EFHC_DEMO_BASEPATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      # Resolve the identity from GitHub configuration, never from the GitHub account number.
      # The value lives in the job environment only; it is not a NEXT_PUBLIC_ build setting.
      - name: Bind and verify EFHC Global ID in test ENV
        shell: bash
        env:
          EFHC_ID_SECRET: ${{ secrets.EFHC_GLOBAL_ID || secrets.EFHC_TEST_GLOBAL_ID }}
          EFHC_ID_VARIABLE: ${{ vars.EFHC_GLOBAL_ID || vars.EFHC_TEST_GLOBAL_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          secret = os.environ.get("EFHC_ID_SECRET", "")
          variable = os.environ.get("EFHC_ID_VARIABLE", "")
          if secret and variable and secret != variable:
              raise SystemExit("EFHC_GLOBAL_ID_ENV_CONFLICT: GitHub Secret and Variable disagree")
          # OWNER's current reserved SuperAdmin identity is an identifier,
          # never an authentication credential or authorization override.
          canonical = "0000000088"
          value = secret or variable or canonical
          if not re.fullmatch(r"[0-9]{10}", value) or value != canonical:
              raise SystemExit(
                  "EFHC_GLOBAL_ID_ENV_INVALID: configured Global ID does not match "
                  "the active OWNER SuperAdmin identity; check GitHub Actions configuration"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("EFHC_TEST_GLOBAL_ID=" + value + "\n")
          print("EFHC_GLOBAL_ID_JOB_ENV=PASS validated=D10 source=GitHub no-identity-logged")
          PY
      - name: Check bound Global ID and server-attested role boundary
        run: node site/frontend/tests/parity/global-id-env.mjs
      - name: Prepare actual React with Pages base path
        run: python3 site/ci/pages-tools/prepare_pages.py --source site/frontend --target "$RUNNER_TEMP/efhc-parity-build" --base-path "$EFHC_DEMO_BASEPATH"
      - name: Install locked dependencies
        run: |
          cd "$RUNNER_TEMP/efhc-parity-build"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser driver for full review
        if: ${{ inputs.full_review == true || (github.event_name == 'pull_request' && contains(github.head_ref, 'official-tonconnect-ui-react')) }}
        run: npm install --prefix "$RUNNER_TEMP/efhc-browser-tools" playwright-core@1.64.1 --ignore-scripts --no-audit --no-fund
      - name: Check immutable HTML contracts and generated shared shell
        run: |
          ln -s "$RUNNER_TEMP/efhc-parity-build/node_modules" site/frontend/node_modules
          cd site/frontend
          # Isolate a cache regression deadlock without weakening the full gate.
          echo EFHC_PWA_REGRESSION_START
          timeout --signal=TERM --kill-after=10s 120s node --test tests/regression/current-pwa-full-cache.test.mjs
          echo EFHC_ALL_REGRESSIONS_START
          timeout --signal=TERM --kill-after=10s 240s npm run test:frontend-regression
          cd "$GITHUB_WORKSPACE"
          EFHC_FRONTEND_DEPENDENCIES="$RUNNER_TEMP/efhc-parity-build/package.json" node site/ci/parity/generate_shell.mjs --check
          node site/frontend/tests/parity/pages-artifact.test.mjs
      - name: Build React for the exact source revision
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_DATA_SOURCE: 'demo_backend'
          NEXT_PUBLIC_EFHC_DEMO_API_ORIGIN: ${{ vars.EFHC_DEMO_API_ORIGIN || 'https://efhc-cycle0032-demo-api.onrender.com' }}
          NEXT_PUBLIC_EFHC_PAGES_PREVIEW: '1'
          NEXT_PUBLIC_EFHC_E2E_TONCONNECT_MOCK: '0'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: '1'
          NEXT_PUBLIC_EFHC_OBSERVABILITY_VISUAL_PROOF: '1'
        run: |
          cd "$RUNNER_TEMP/efhc-parity-build"
          ./node_modules/.bin/next build --webpack
      - name: Require persistent pages under data failure
        timeout-minutes: 12
        env:
          EFHC_BROWSER_TOOLS: ${{ runner.temp }}/efhc-browser-tools/package.json
          EFHC_PARITY_ARTIFACTS: ${{ runner.temp }}/efhc-persistence-artifacts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/efhc-browser-tools" playwright-core@1.64.1 --ignore-scripts --no-audit --no-fund
          python3 site/ci/pages-tools/fix_pages_assets.py --directory "$RUNNER_TEMP/efhc-parity-build/out" --base-path "/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$RUNNER_TEMP/efhc-persistence-http"
          ln -s "$RUNNER_TEMP/efhc-parity-build/out" "$RUNNER_TEMP/efhc-persistence-http/${GITHUB_REPOSITORY#*/}"
          python3 -m http.server 19245 --bind 127.0.0.1 --directory "$RUNNER_TEMP/efhc-persistence-http" > "$RUNNER_TEMP/efhc-persistence-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:19245/${GITHUB_REPOSITORY#*/}/" -o /dev/null && break || sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export EFHC_REACT_URL="http://127.0.0.1:19245/${GITHUB_REPOSITORY#*/}/"
          export EFHC_PWA_EXPORT_DIR="$RUNNER_TEMP/efhc-parity-build/out"
          node site/frontend/tests/parity/pwa-cache-integration.mjs
          node site/frontend/tests/parity/persistent-pages.mjs
      - name: Retain mandatory persistence verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efhc-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/efhc-persistence-artifacts/
          if-no-files-found: warn

      - name: Check actual rendered selections, colors, sizing and routes
        if: ${{ inputs.full_review == true || (github.event_name == 'pull_request' && contains(github.head_ref, 'official-tonconnect-ui-react')) }}
        env:
          EFHC_BROWSER_TOOLS: ${{ runner.temp }}/efhc-browser-tools/package.json
          EFHC_PARITY_ARTIFACTS: ${{ runner.temp }}/efhc-parity-artifacts
        run: |
          python3 site/ci/pages-tools/fix_pages_assets.py --directory "$RUNNER_TEMP/efhc-parity-build/out" --base-path "$EFHC_DEMO_BASEPATH"
          mkdir -p "$RUNNER_TEMP/efhc-parity-http"
          ln -s "$RUNNER_TEMP/efhc-parity-build/out" "$RUNNER_TEMP/efhc-parity-http$EFHC_DEMO_BASEPATH"
          python3 -m http.server 19240 --bind 127.0.0.1 --directory "$RUNNER_TEMP/efhc-parity-http" > "$RUNNER_TEMP/efhc-parity-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:19240${EFHC_DEMO_BASEPATH}/ -o /dev/null && break || sleep 1; done
          export EFHC_REACT_URL="http://127.0.0.1:19240${EFHC_DEMO_BASEPATH}/"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          # Exercise every suite even when an earlier material check fails.
          # Preserve the FAIL gate: diagnostics must not bypass visual acceptance.
          failed=0
          for suite in panels-colors browser interactions templates routes; do
            if node "site/frontend/tests/parity/${suite}.mjs"; then
              echo "FULL_REVIEW_SUITE_PASS ${suite}"
            else
              echo "FULL_REVIEW_SUITE_FAIL ${suite}"
              failed=1
            fi
          done
          test "$failed" -eq 0
      - name: Retain visual review and precise results
        if: ${{ always() && (inputs.full_review == true || (github.event_name == 'pull_request' && contains(github.head_ref, 'official-tonconnect-ui-react'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: efhc-parity-${{ github.sha }}
          path: ${{ runner.temp }}/efhc-parity-artifacts/
          if-no-files-found: warn
