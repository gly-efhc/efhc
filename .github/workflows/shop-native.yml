name: Shop native contracts
on:
  pull_request:
    paths: ['main/**', 'site/**', '.github/workflows/shop-native.yml']
  push:
    branches: [main]
    paths: ['main/**', 'site/**', '.github/workflows/shop-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_shop_ci_only
          POSTGRES_DB: efhc_shop_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d efhc_shop_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: ci
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: postgresql://postgres:synthetic_shop_ci_only@127.0.0.1:5432/efhc_shop_ci
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:synthetic_shop_ci_only@127.0.0.1:5432/efhc_shop_ci
      SYNC_DATABASE_URL: postgresql://postgres:synthetic_shop_ci_only@127.0.0.1:5432/efhc_shop_ci
      PSYCOPG_URL: postgresql://postgres:synthetic_shop_ci_only@127.0.0.1:5432/efhc_shop_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      - name: Record exact candidate and verify database safety guard
        run: |
          git rev-parse HEAD
          python -m unittest discover -s site/ci -p test_shop_database_guard.py -v
      - name: Install locked backend and test dependencies
        run: python -m pip install -r main/backend/requirements.lock -r main/requirements-test.txt
      - name: Native API, PostgreSQL and watcher contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/main/backend:${{ github.workspace }}/main:${{ github.workspace }}/main/tests
        run: python site/ci/run_shop_native.py
      - name: Native TON and Telegram session contract tests
        working-directory: main
        env:
          PYTHONPATH: ${{ github.workspace }}/main/backend:${{ github.workspace }}/main
        run: |
          python -m pytest -q tests/efhc_backend/identity/test_ton_auth_session.py tests/efhc_backend/identity/test_telegram_auth_session.py
      - name: Install frontend lockfile and run native regressions
        working-directory: site/frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:frontend-regression
      - name: Prepare public DEMO copy
        run: |
          python site/ci/pages-tools/prepare_pages.py --source site/frontend --target "$RUNNER_TEMP/shop-pages" --base-path /efhc
          rm -rf "$RUNNER_TEMP/shop-pages/node_modules"
          ln -s "$GITHUB_WORKSPACE/site/frontend/node_modules" "$RUNNER_TEMP/shop-pages/node_modules"
      - name: Build public DEMO with isolated fixture origin
        env:
          EFHC_DEMO_BASEPATH: /efhc
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_EFHC_DATA_SOURCE: demo_backend
          NEXT_PUBLIC_EFHC_BACKEND_API_ORIGIN: https://shop-fixture.invalid
          NEXT_PUBLIC_EFHC_PAGES_PREVIEW: '1'
          NEXT_PUBLIC_EFHC_E2E_DISABLE_TONCONNECT_RESTORE: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd "$RUNNER_TEMP/shop-pages"
          npm run build
      - name: Verify export and rendered Shop without purchases
        env:
          SHOP_EXPORT_DIRECTORY: ${{ runner.temp }}/shop-pages/out
          SHOP_REPORT_DIRECTORY: ${{ runner.temp }}/shop-evidence
          EFHC_SERWIST_PACKAGE_JSON: ${{ runner.temp }}/shop-pages/package.json
        run: |
          python site/ci/pages-tools/fix_pages_assets.py --directory "$SHOP_EXPORT_DIRECTORY" --base-path /efhc
          python site/ci/pages-tools/verify_export.py --directory "$SHOP_EXPORT_DIRECTORY" --base-path /efhc
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          python -m venv "$RUNNER_TEMP/shop-browser"
          browser_python="$RUNNER_TEMP/shop-browser/bin/python"
          "$browser_python" -m pip --isolated install --index-url https://pypi.org/simple --upgrade playwright
          "$browser_python" -m playwright --version
          "$browser_python" -m playwright install --with-deps chromium
          "$browser_python" site/ci/shop_ui_smoke.py
