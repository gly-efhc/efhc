name: EFHC — live Genesis guest and protected Admin HTTP smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/efhc-preview-smoke.yml"]
  workflow_run:
    workflows: ["EFHC — React DEMO Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-preview:
    name: Isolated TEST guest user data and protected Admin boundary
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Real TEST preview HTTP smoke (no financial writes)
        env:
          API: https://efhc-cycle0032-demo-api.onrender.com
          PAGES: https://gly-efhc.github.io/efhc/
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse
          
          api = os.environ["API"]
          pages = os.environ["PAGES"]
          origin = "https://gly-efhc.github.io"
          
          def request(path, method="GET", bearer=None, csrf=None, payload=None):
              url = api + path
              headers = {"Origin": origin, "Accept": "application/json"}
              if bearer:
                  headers["Authorization"] = "Bearer " + bearer
              if method == "POST":
                  headers["Content-Type"] = "application/json"
                  if csrf:
                      headers["X-EFHC-Test-CSRF"] = csrf
              req = urllib.request.Request(
                  url, method=method,
                  data=json.dumps(payload if payload is not None else {}).encode("utf-8") if method == "POST" else None,
                  headers=headers,
              )
              last = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as res:
                          raw = res.read(2000000)
                          return res.status, dict(res.headers), json.loads(raw)
                  except urllib.error.HTTPError as exc:
                      # Show a bounded error detail only; never print credentials.
                      detail = exc.read(512).decode("utf-8", "replace")
                      last = f"HTTP {exc.code}: {detail[:512]}"
                      if attempt != 3:
                          time.sleep(3)
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = type(exc).__name__
                      if attempt != 3:
                          time.sleep(3)
              raise AssertionError(f"{method} {path} failed: {last}")
          
          # Public Genesis TEST guests must receive a private slot.
          # Global ID 88 is reserved for the protected SuperAdmin identity.
          status, hdr, guest = request("/api/staging/guest", "POST")
          gid = guest.get("global_id", "")
          assert status == 200 and guest.get("scope") == "guest", "guest session unavailable"
          assert isinstance(gid, str) and len(gid) == 10 and gid.isdigit() and 3001 <= int(gid) <= 4000, "Guest ID outside canonical 3001-4000 pool"
          token = guest["demo_bearer_token"]
          assert len(token) > 32 and guest.get("guest_resume_token"), "missing guest credential"
          print("TEST_GUEST_IDENTITY=PASS range=3001..4000 scope=guest")

          status, hdr, ctx = request("/api/auth/session", bearer=token)
          assert status == 200 and ctx.get("global_id") == gid, "USER owner not resolved"
          assert {k.lower(): v for k, v in hdr.items()}.get("x-efhc-data-source") == "neon-test", "wrong backend source"
          print("USER_NATIVE_HTTP_AUTH_CONTEXT=PASS neon-test")

          def require_guest_admin_denied(path):
              req = urllib.request.Request(
                  api + path,
                  headers={"Origin": origin, "Authorization": "Bearer " + token},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raise AssertionError("Guest received Admin HTTP " + str(response.status) + " at " + path)
              except urllib.error.HTTPError as exc:
                  assert exc.code == 403, "Admin route unexpected status " + str(exc.code)
              print("GUEST_ADMIN_DENIED=PASS " + path)

          require_guest_admin_denied("/api/admin/access")
          require_guest_admin_denied("/api/admin/reports/overview")

          status, hdr, active = request("/api/panels/active?limit=25&force_sync=0", bearer=token)
          assert status == 200 and len(active["items"]) == 5 and active.get("next_cursor") is None, "Canonical active panels missing"
          status, hdr, archived = request("/api/panels/archive?limit=25&force_sync=0", bearer=token)
          assert status == 200 and len(archived["items"]) == 10 and archived.get("next_cursor") is None, "Canonical archived panels missing"
          print("GENESIS_PANELS_5_ACTIVE_10_ARCHIVED=PASS")

          # C0036: require the actual formerly failing read routes and wire DTOs.
          import re
          for path in (
              "/api/referrals/stats/me",
              "/api/profile/avatar",
              "/api/profile/avatar/sources",
              "/api/tasks/my",
              "/api/tasks/catalog",
              "/api/tasks/earnings/me",
          ):
              status, _, data = request(path, bearer=token)
              assert status == 200 and isinstance(data, dict), "Read route failed: " + path
              if path == "/api/referrals/stats/me":
                  assert re.fullmatch(r"-?\d+(?:\.\d{1,8})?", data["referrals_bonus_total"]), "Invalid D8 wire notation"
              if path == "/api/tasks/my":
                  assert all(item["id"] is None or int(item["id"]) > 0 for item in data["items"]), "Fabricated task Lifetime ID zero"
              if path in ("/api/tasks/catalog", "/api/tasks/my"):
                  assert all(re.fullmatch(r"-?\d+(?:\.\d{1,8})?", item["bonus_efhc"]) for item in data["items"]), "Invalid Tasks reward wire notation"
              if path == "/api/tasks/earnings/me":
                  assert re.fullmatch(r"-?\d+(?:\.\d{1,8})?", data["total_bonus_earned"]), "Invalid Tasks earnings wire notation"
              print("C0036_REAL_READ_CONTRACT=PASS " + path)
          
          status, hdr, snap = request("/api/sync/me?fresh=0", "POST", bearer=token, csrf=guest["csrf"])
          assert status == 200 and isinstance(snap, dict), "USER data snapshot unavailable"
          print("USER_SNAPSHOT_NEON=PASS")
          
          req = urllib.request.Request(pages, method="GET")
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read(2000000).decode("utf-8", "replace")
          assert "EFHC" in html and "html" in html.lower(), "Pages entry missing"
          print("PUBLIC_PAGES_HTML=PASS")
          # Release the TEST slot; CI must not consume the finite guest pool.
          status, _, result = request(
              "/api/staging/logout", "POST", bearer=token, csrf=guest["csrf"],
              payload={"resume_token":guest["guest_resume_token"]},
          )
          assert status == 200 and result.get("ok") is True, "Guest lease cleanup failed"
          print("GENESIS_GUEST_HTTP_AND_ADMIN_DENIAL_SMOKE=PASS")
          PY
      - name: Checkout real React route manifest for Chrome smoke
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: C0034_REAL_PAGES_CHROME_VISIBILITY
        timeout-minutes: 12
        env:
          EFHC_BROWSER_TOOLS: ${{ runner.temp }}/efhc-c0034-browser-tools/package.json
          EFHC_PAGES_URL: https://gly-efhc.github.io/efhc/
          EFHC_PARITY_ARTIFACTS: ${{ runner.temp }}/efhc-c0034-live-artifacts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/efhc-c0034-browser-tools" playwright-core@1.64.1 --ignore-scripts --no-audit --no-fund
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --check site/frontend/tests/parity/live-pages.mjs
          node site/frontend/tests/parity/live-pages.mjs
      - name: Retain live C0034 route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efhc-c0034-route-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/efhc-c0034-live-artifacts/
          if-no-files-found: warn
